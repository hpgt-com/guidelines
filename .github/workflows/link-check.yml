name: Link check

# Finner døde lenker i Markdown-filene med lychee.
#  - På pull requests: bare lenker innad i repoet, med ankere (raskt og stabilt).
#  - Hver mandag og ved manuell kjøring: også eksterne lenker.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 6 * * 1' # mandager 06:29 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --include-fragments
            --no-progress
            --exclude-path templates
            ${{ github.event_name == 'pull_request' && '--offline' || '' }}
            '**/*.md'
          fail: true
          jobSummary: true
